name: Hello World

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions! Branch is ${{ github.ref_name }}"

      - name: Show repo info
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"

      - name: List files
        run: ls -la
